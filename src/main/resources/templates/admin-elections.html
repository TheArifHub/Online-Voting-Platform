<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Election Status - Online Voting System</title>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Raleway', sans-serif;
        }
        
        body {
            background: linear-gradient(45deg, #f1f7ff, #ffffff);
            min-height: 100vh;
            color: #2d3436;
        }
        
        nav {
            background: #1a237e;
            padding: 1.2rem;
            box-shadow: 0 4px 12px rgba(26, 35, 126, 0.2);
        }
        
        nav ul {
            display: flex;
            justify-content: flex-end;
            list-style: none;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        nav ul li a {
            color: white;
            text-decoration: none;
            padding: 0.8rem 1.2rem;
            margin: 0 0.5rem;
            border-radius: 6px;
            transition: all 0.3s ease;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        nav ul li a:hover {
            background: #283593;
            transform: translateY(-2px);
        }
        
        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 2rem;
        }
        
        .header {
            background: rgba(255, 255, 255, 0.95);
            padding: 3rem 2rem;
            border-radius: 20px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.1);
            text-align: center;
            position: relative;
            overflow: hidden;
            margin-bottom: 2.5rem;
        }
        
        .header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, #ff9933, #ffffff, #138808);
        }
        
        .header h1 {
            font-size: 2.5rem;
            color: #1a237e;
            margin-bottom: 1rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        .election-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 2rem;
            margin-bottom: 2.5rem;
        }
        
        .stat-card {
            background: white;
            padding: 2rem;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.06);
            transition: all 0.4s ease;
            border: 1px solid rgba(26, 35, 126, 0.1);
        }
        
        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 30px rgba(0,0,0,0.12);
        }
        
        .stat-card h3 {
            color: #1a237e;
            font-size: 1.3rem;
            margin-bottom: 1rem;
            font-weight: 700;
            text-transform: uppercase;
        }
        
        .stat-card p {
            color: #3498db;
            font-size: 2.5rem;
            font-weight: bold;
        }
        
        .results-table {
            background: white;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.06);
            overflow: hidden;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        th, td {
            padding: 1.2rem;
            text-align: left;
            border-bottom: 1px solid #eee;
        }
        
        th {
            background: #1a237e;
            color: white;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        tr:hover {
            background: rgba(26, 35, 126, 0.05);
        }
        
        .position {
            font-weight: bold;
            color: #1a237e;
            font-size: 1.2rem;
        }
        
        .progress-bar {
            width: 200px;
            height: 20px;
            background: #f1f7ff;
            border-radius: 10px;
            overflow: hidden;
        }
        
        .progress {
            height: 100%;
            background: linear-gradient(45deg, #1a237e, #3498db);
            transition: width 0.3s ease;
        }
        
        @media (max-width: 768px) {
            .header h1 {
                font-size: 2rem;
            }
            
            .progress-bar {
                width: 150px;
            }
        }
        </style>
        
</head>
<body>
    <nav>
        <ul>
            <li><a href="/admin/dashboard">Dashboard</a></li>
            <li><a href="/admin/manage-candidates">Manage Candidates</a></li>
            <li><a href="/admin/manage-voters">Manage Voters</a></li>
            <li><a href="/admin/elections">Elections</a></li>
            <li><a href="/logout">Logout</a></li>
        </ul>
    </nav>

    <div class="container">
        <div class="header">
            <h1>Election Status</h1>
            <p>Current election results and statistics</p>
        </div>

        <div class="election-stats">
            <div class="stat-card">
                <h3>Total Votes Cast</h3>
                <p th:text="${totalVotes}">0</p>
            </div>
            <div class="stat-card">
                <h3>Total Candidates</h3>
                <p th:text="${candidates.size()}">0</p>
            </div>
        </div>

        <div class="results-table">
            <table>
                <thead>
                    <tr>
                        <th>Position</th>
                        <th>Candidate</th>
                        <th>Party</th>
                        <th>Constituency</th>
                        <th>Votes</th>
                        <th>Progress</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="candidate, iterStat : ${candidates}">
                        <td class="position" th:text="${iterStat.count}">1</td>
                        <td th:text="${candidate.fullname}">John Doe</td>
                        <td th:text="${candidate.party}">Party Name</td>
                        <td th:text="${candidate.constituency}">Constituency</td>
                        <td th:text="${candidate.voteCount}">0</td>
                        <td>
                            <div class="progress-bar">
                                <div class="progress" 
                                     th:style="'width: ' + ${totalVotes > 0 ? (candidate.voteCount * 100 / totalVotes) : 0} + '%'">
                                </div>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
