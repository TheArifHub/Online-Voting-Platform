<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - Online Voting System</title>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Raleway', sans-serif;
        }
        
        body {
            background: linear-gradient(45deg, #f1f7ff, #ffffff);
            min-height: 100vh;
            color: #2d3436;
        }
        
        nav {
            background: #1a237e;
            padding: 1.2rem;
            box-shadow: 0 4px 12px rgba(26, 35, 126, 0.2);
        }
        
        nav ul {
            display: flex;
            justify-content: flex-end;
            list-style: none;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        nav ul li a {
            color: white;
            text-decoration: none;
            padding: 0.8rem 1.2rem;
            margin: 0 0.5rem;
            border-radius: 6px;
            transition: all 0.3s ease;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        nav ul li a:hover {
            background: #283593;
            transform: translateY(-2px);
        }
        
        .profile-container {
            max-width: 900px;
            margin: 3rem auto;
            padding: 2rem;
        }
        
        .profile-header {
            background: rgba(255, 255, 255, 0.95);
            padding: 3rem 2rem;
            border-radius: 20px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.1);
            text-align: center;
            position: relative;
            overflow: hidden;
            margin-bottom: 2rem;
        }
        
        .profile-header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, #ff9933, #ffffff, #138808);
        }
        
        .profile-image {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            margin: 0 auto 2rem;
            overflow: hidden;
            border: 4px solid #1a237e;
            box-shadow: 0 8px 20px rgba(26, 35, 126, 0.2);
        }
        
        .profile-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .profile-name {
            font-size: 2.5rem;
            color: #1a237e;
            margin-bottom: 1rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        .profile-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 2rem;
            margin-top: 2rem;
        }
        
        .detail-card {
            background: white;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.06);
            transition: all 0.4s ease;
        }
        
        .detail-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 30px rgba(0,0,0,0.12);
        }
        
        .detail-card h3 {
            color: #1a237e;
            font-size: 1.3rem;
            margin-bottom: 1rem;
            font-weight: 700;
            text-transform: uppercase;
        }
        
        .detail-card p {
            color: #455a64;
            font-size: 1.1rem;
            line-height: 1.6;
        }
        
        .edit-button {
            display: inline-block;
            padding: 1rem 2.5rem;
            margin-top: 2rem;
            background: #1a237e;
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.4s ease;
            box-shadow: 0 5px 15px rgba(26, 35, 126, 0.3);
            text-decoration: none;
        }
        
        .edit-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        }
        
        @media (max-width: 768px) {
            .profile-name {
                font-size: 2rem;
            }
            
            .profile-image {
                width: 150px;
                height: 150px;
            }
        }
        </style>
        
</head>
<body>
    <nav>
        <ul>
            <li><a href="/candidate/dashboard">Dashboard</a></li>
            <li><a href="/candidate/profile">My Profile</a></li>
            <li><a href="/candidate/election-status">Election Status</a></li>
            <li><a href="/logout">Logout</a></li>
        </ul>
    </nav>

    <div class="profile-container">
        <div class="profile-header">
            <div class="profile-image">
                <img th:if="${session.candidate.profilePicUrl}" 
                     th:src="${session.candidate.profilePicUrl}" 
                     alt="Profile Picture">
                <img th:unless="${session.candidate.profilePicUrl}" 
                     src="/images/default-profile.png" 
                     alt="Default Profile">
            </div>
            <h1 th:text="${session.candidate.fullname}">Candidate Name</h1>
        </div>

        <div class="profile-details">
            <div class="detail-group">
                <h3>Email</h3>
                <p th:text="${session.candidate.email}">email@example.com</p>
            </div>

            <div class="detail-group">
                <h3>Political Party</h3>
                <p th:text="${session.candidate.party}">Party Name</p>
            </div>

            <div class="detail-group">
                <h3>Constituency</h3>
                <p th:text="${session.candidate.constituency}">Constituency Name</p>
            </div>

            <div class="manifesto-section">
                <h3>Manifesto</h3>
                <p th:text="${session.candidate.manifesto}">Candidate's manifesto text</p>
            </div>

            <a th:href="@{/candidate/update-profile/{id}(id=${session.candidate.id})}" class="edit-button">
                Edit Profile
            </a>
        </div>
    </div>
</body>
</html>
