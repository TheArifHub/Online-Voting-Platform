<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Profile - Online Voting System</title>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Raleway', sans-serif;
        }
        
        body {
            background: linear-gradient(45deg, #f1f7ff, #ffffff);
            min-height: 100vh;
            color: #2d3436;
        }
        
        nav {
            background: #1a237e;
            padding: 1.2rem;
            box-shadow: 0 4px 12px rgba(26, 35, 126, 0.2);
        }
        
        nav ul {
            display: flex;
            justify-content: flex-end;
            list-style: none;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        nav ul li a {
            color: white;
            text-decoration: none;
            padding: 0.8rem 1.2rem;
            margin: 0 0.5rem;
            border-radius: 6px;
            transition: all 0.3s ease;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        nav ul li a:hover {
            background: #283593;
            transform: translateY(-2px);
        }
        
        .container {
            max-width: 900px;
            margin: 3rem auto;
            padding: 3rem 2rem;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.1);
            position: relative;
            overflow: hidden;
        }
        
        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, #ff9933, #ffffff, #138808);
        }
        
        .profile-header {
            text-align: center;
            margin-bottom: 3rem;
        }
        
        .profile-image {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            margin: 0 auto 2rem;
            overflow: hidden;
            border: 4px solid #1a237e;
            box-shadow: 0 8px 20px rgba(26, 35, 126, 0.2);
        }
        
        .profile-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .profile-header h1 {
            font-size: 2.5rem;
            color: #1a237e;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        .form-group label {
            display: block;
            color: #1a237e;
            margin-bottom: 0.8rem;
            font-weight: 600;
            font-size: 1.1rem;
        }
        
        .form-group input,
        .form-group select {
            width: 100%;
            padding: 1rem;
            border: 2px solid rgba(26, 35, 126, 0.1);
            border-radius: 8px;
            font-size: 1.1rem;
            transition: all 0.3s ease;
        }
        
        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #1a237e;
            box-shadow: 0 0 10px rgba(26, 35, 126, 0.1);
        }
        
        .form-group input[readonly] {
            background-color: #f8f9fa;
            cursor: not-allowed;
        }
        
        .submit-btn {
            width: 100%;
            padding: 1.2rem;
            background: #1a237e;
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.4s ease;
            box-shadow: 0 5px 15px rgba(26, 35, 126, 0.3);
            margin-top: 2rem;
        }
        
        .submit-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        }
        
        .error-message {
            color: #e74c3c;
            font-size: 0.9rem;
            margin-top: 0.5rem;
        }
        
        @media (max-width: 768px) {
            .container {
                margin: 2rem;
            }
            
            .profile-header h1 {
                font-size: 2rem;
            }
            
            .profile-image {
                width: 150px;
                height: 150px;
            }
        }
        </style>
        
</head>
<body>
    <nav>
        <ul>
            <li><a href="/candidate/dashboard">Dashboard</a></li>
            <li><a href="/candidate/profile">My Profile</a></li>
            <li><a href="/candidate/election-status">Election Status</a></li>
            <li><a href="/logout">Logout</a></li>
        </ul>
    </nav>

    <div class="container">
        <div class="profile-header">
            <div class="profile-image">
                <img th:if="${session.candidate.profilePicUrl}" 
                     th:src="${session.candidate.profilePicUrl}" 
                     alt="Profile Picture">
                <img th:unless="${session.candidate.profilePicUrl}" 
                     src="/images/default-profile.png" 
                     alt="Default Profile">
            </div>
            <h1>Update Profile</h1>
        </div>
        <form th:action="@{/candidate/update-profile/{id}(id=${candidate.id})}" method="post" enctype="multipart/form-data" th:object="${candidate}">
            <input type="hidden" name="id" th:value="${candidate.id}">
            <div class="form-group">
                <label for="profilePic">Update Profile Picture</label>
                <input type="file" id="profilePic" name="profilePic" accept="image/*">
            </div>

            <div class="form-group">
                <label for="fullname">Full Name</label>
                <input type="text" id="fullname" th:field="*{fullname}" required>
                <span class="error-message" th:errors="*{fullname}"></span>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" th:field="*{email}" readonly>
            </div>

            <div class="form-group">
                <label for="party">Political Party</label>
                <input type="text" id="party" th:field="*{party}" readonly>
            </div>

            <div class="form-group">
                <label for="constituency">Constituency</label>
                <input type="text" id="constituency" th:field="*{constituency}" readonly>
            </div>

            <div class="form-group">
                <label for="manifesto">Manifesto</label>
                <input type="text" id="manifesto" th:field="*{manifesto}">
                <span class="error-message" th:errors="*{manifesto}"></span>
            </div>

            <button type="submit" class="submit-btn">Update Profile</button>
        </form>
    </div>
</body>
</html>
