<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTP Verification</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .otp-container {
            background: rgba(255, 255, 255, 0.9);
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 400px;
            text-align: center;
        }

        .otp-container h2 {
            font-size: 2rem;
            color: #2c3e50;
            margin-bottom: 1.5rem;
        }

        .timer {
            font-size: 1.2rem;
            color: #e74c3c;
            margin-bottom: 1.5rem;
            font-weight: 600;
        }

        .otp-container form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .otp-container input {
            padding: 1rem;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 1.1rem;
            transition: border-color 0.3s;
        }

        .otp-container input:focus {
            outline: none;
            border-color: #3498db;
        }

        .otp-container button {
            padding: 1rem 2rem;
            border: none;
            border-radius: 5px;
            font-size: 1.1rem;
            cursor: pointer;
            background-color: #3498db;
            color: white;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .otp-container button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        .otp-container button:disabled {
            background-color: #95a5a6;
            cursor: not-allowed;
        }

        #resend-btn {
            color: #3498db;
            text-decoration: none;
            font-size: 1rem;
            margin-top: 1rem;
            display: inline-block;
            transition: color 0.3s;
        }

        #resend-btn:hover {
            color: #2980b9;
        }

        .message h3 {
            margin-bottom: 1rem;
            padding: 0.5rem;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="otp-container">
        <h2>OTP Verification</h2>
        <p class="timer" id="timer">Time remaining: 60 seconds</p>
        
        <div class="message">
            <h3 th:if="${success}" style="color: green;" th:text="${success}"></h3>
            <h3 th:if="${error}" style="color: red;" th:text="${error}"></h3>
        </div>
        
        <form action="/candidate/otp" method="post">
            <input type="hidden" name="id" th:value="${id}" />
            <label for="otp">Enter OTP:</label>
            <input type="text" id="otp" name="otp" placeholder="Enter your OTP" />
            <button type="submit" id="submit-btn">Verify OTP</button>
            <a th:href="'/candidate/resend-otp/'+${id}" id="resend-btn" style="display: none;">Resend OTP</a>
        </form>
    </div>

    <script>
        let timeLeft = 60;
        const timerElement = document.getElementById('timer');
        const submitButton = document.getElementById('submit-btn');
        const resendLink = document.getElementById('resend-btn');

        const timer = setInterval(() => {
            if (timeLeft <= 0) {
                clearInterval(timer);
                timerElement.textContent = 'Time expired!';
                submitButton.disabled = true;
                resendLink.style.display = 'block';
            } else {
                timerElement.textContent = `Time remaining: ${timeLeft} seconds`;
                timeLeft -= 1;
            }
        }, 1000);
    </script>
</body>
</html>
