<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Election Results - Online Voting System</title>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Raleway', sans-serif;
        }
        
        body {
            background: linear-gradient(45deg, #f1f7ff, #ffffff);
            min-height: 100vh;
            color: #2d3436;
        }
        
        nav {
            background: #1a237e;
            padding: 1.2rem;
            box-shadow: 0 4px 12px rgba(26, 35, 126, 0.2);
        }
        
        nav ul {
            display: flex;
            justify-content: flex-end;
            list-style: none;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        nav ul li a {
            color: white;
            text-decoration: none;
            padding: 0.8rem 1.2rem;
            margin: 0 0.5rem;
            border-radius: 6px;
            transition: all 0.3s ease;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        nav ul li a:hover {
            background: #283593;
            transform: translateY(-2px);
        }
        
        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 2rem;
        }
        
        .results-header {
            background: rgba(255, 255, 255, 0.95);
            padding: 3rem 2rem;
            border-radius: 20px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.1);
            text-align: center;
            position: relative;
            overflow: hidden;
            margin-bottom: 2.5rem;
        }
        
        .results-header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, #ff9933, #ffffff, #138808);
        }
        
        .results-header h1 {
            font-size: 2.5rem;
            color: #1a237e;
            margin-bottom: 1rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
        }
        
        .candidate-card {
            background: white;
            padding: 2.5rem;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.06);
            transition: all 0.4s ease;
            border: 1px solid rgba(26, 35, 126, 0.1);
        }
        
        .candidate-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 30px rgba(0,0,0,0.12);
        }
        
        .position {
            font-size: 2.5rem;
            color: #1a237e;
            font-weight: 800;
            margin-bottom: 1rem;
        }
        
        .candidate-card h2 {
            color: #1a237e;
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
            font-weight: 700;
        }
        
        .progress-bar {
            width: 100%;
            height: 20px;
            background: #f1f7ff;
            border-radius: 10px;
            overflow: hidden;
            margin: 1rem 0;
        }
        
        .progress {
            height: 100%;
            background: linear-gradient(45deg, #1a237e, #3498db);
            transition: width 0.3s ease;
        }
        
        .vote-count {
            font-size: 1.3rem;
            color: #1a237e;
            font-weight: 600;
        }
        
        @media (max-width: 768px) {
            .results-header h1 {
                font-size: 2rem;
            }
            
            .position {
                font-size: 2rem;
            }
        }
        </style>
        
</head>
<body>
    <nav>
        <ul>
            <li><a href="/home">Home</a></li>
            <li><a href="/about">About</a></li>
            <li><a href="/vote-now">Vote Now</a></li>
            <li><a href="/results">Results</a></li>
            <li><a href="/contact">Contact</a></li>
        </ul>
    </nav>

    <div class="container">
        <div class="results-header">
            <h1>Election Results</h1>
            <p>Total Votes Cast: <span th:text="${totalVotes}">0</span></p>
        </div>

        <div class="results-grid">
            <div class="candidate-card" th:each="candidate, iterStat : ${candidates}">
                <div class="position" th:text="${iterStat.count}">1</div>
                <h2 th:text="${candidate.fullname}">Candidate Name</h2>
                <p th:text="${candidate.party}">Party Name</p>
                <div class="progress-bar">
                    <div class="progress" 
                         th:style="'width: ' + ${totalVotes > 0 ? (candidate.voteCount * 100 / totalVotes) : 0} + '%'">
                    </div>
                </div>
                <div class="vote-count">
                    <span th:text="${candidate.voteCount}">0</span> votes
                    (<span th:text="${totalVotes > 0 ? #numbers.formatDecimal(candidate.voteCount * 100.0 / totalVotes, 1, 1) : 0}">0</span>%)
                </div>
            </div>
        </div>
    </div>
</body>
</html>
