<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Voting System - OTP Verification</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
        }

        nav {
            background-color: #2c3e50;
            padding: 1rem;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        nav ul {
            display: flex;
            justify-content: flex-end;
            list-style: none;
            max-width: 1200px;
            margin: 0 auto;
        }

        nav ul li a {
            color: white;
            text-decoration: none;
            padding: 0.5rem 1rem;
            margin: 0 0.5rem;
            border-radius: 4px;
            transition: background-color 0.3s;
        }

        nav ul li a:hover {
            background-color: #34495e;
        }

        .otp-container {
            max-width: 500px;
            margin: 4rem auto;
            padding: 2rem;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
        }

        .otp-container h1 {
            color: #2c3e50;
            margin-bottom: 1.5rem;
        }

        .welcome-message {
            font-size: 1.2rem;
            color: #34495e;
            margin-bottom: 2rem;
        }

        .otp-display {
            font-size: 2.5rem;
            font-weight: bold;
            color: #3498db;
            letter-spacing: 3px;
            margin: 2rem 0;
            padding: 1rem;
            background: #f8f9fa;
            border-radius: 8px;
        }

        .instructions {
            color: #7f8c8d;
            margin-top: 1.5rem;
            font-size: 0.9rem;
        }

        .verify-btn {
            background-color: #2ecc71;
            color: white;
            padding: 1rem 2rem;
            border: none;
            border-radius: 5px;
            font-size: 1.1rem;
            cursor: pointer;
            margin-top: 2rem;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .verify-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>
    <nav>
        <ul>
            <li><a href="#home">Home</a></li>
            <li><a href="#about">About</a></li>
            <li><a href="#vote">Vote Now</a></li>
            <li><a href="#results">Results</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </nav>

    <div class="otp-container">
        <h1>OTP Verification</h1>
        <div class="welcome-message">
            Welcome, <span th:text="${x.fullname}">User</span>!
        </div>
        <p>Your One-Time Password is:</p>
        <div class="otp-display" th:text="${x.otp}">000000</div>
        <p class="instructions">
            Please use this OTP to verify your account. This code will expire in 10 minutes.
        </p>
        <button class="verify-btn">Verify OTP</button>
    </div>
</body>
</html>
