<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Voting System - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            max-width: 400px;
            padding: 2rem;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .login-container h1 {
            color: #2c3e50;
            margin-bottom: 2rem;
        }

        .switch-buttons {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .switch-buttons button {
            padding: 1rem;
            border: none;
            background-color: #3498db;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            transition: background-color 0.3s, transform 0.3s;
            width: 100%;
        }

        .switch-buttons button:hover {
            background-color: #2980b9;
            transform: translateY(-2px);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            color: #2c3e50;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid #bdc3c7;
            border-radius: 4px;
            font-size: 1rem;
        }

        .form-group input:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 5px rgba(52, 152, 219, 0.3);
        }

        .login-btn {
            background-color: #3498db;
            color: white;
            padding: 1rem 2rem;
            border: none;
            border-radius: 5px;
            font-size: 1.1rem;
            cursor: pointer;
            width: 100%;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>Login</h1>
        
        <!-- Buttons to select login type -->
        <div id="buttons" class="switch-buttons">
            <button onclick="showVoterForm()">Login as Voter</button>
            <button onclick="showCandidateForm()">Login as Candidate</button>
            <button onclick="showAdminForm()">Login as Admin</button>
        </div>

        <!-- Voter Login Form -->
        <form id="voter-form" class="hidden" action="/voter/login" method="post">
            <div class="form-group">
                <label for="voter-id">Voter ID</label>
                <input type="text" id="voter-id" name="voterid" required>
            </div>
            <div class="form-group">
                <label for="voter-password">Password</label>
                <input type="password" id="voter-password" name="password" required>
            </div>
            <button type="submit" class="login-btn">Login as Voter</button>
        </form>

        <!-- Candidate Login Form -->
        <form id="candidate-form" class="hidden" action="/candidate/login" method="post">
            <div class="form-group">
                <label for="candidate-email">Email</label>
                <input type="email" id="candidate-email" name="email" required>
            </div>
            <div class="form-group">
                <label for="candidate-password">Password</label>
                <input type="password" id="candidate-password" name="password" required>
            </div>
            <button type="submit" class="login-btn">Login as Candidate</button>
        </form>

        <!-- Admin Login Form -->
        <form id="admin-form" class="hidden" action="/admin/login" method="post">
            <div class="form-group">
                <label for="admin-name">Admin Name</label>
                <input type="text" id="admin-name" name="adminname" required>
            </div>
            <div class="form-group">
                <label for="admin-password">Password</label>
                <input type="password" id="admin-password" name="password" required>
            </div>
            <button type="submit" class="login-btn">Login as Admin</button>
        </form>
    </div>

    <script>
        function showVoterForm() {
            hideAllForms();
            document.getElementById("voter-form").classList.remove("hidden");
        }

        function showCandidateForm() {
            hideAllForms();
            document.getElementById("candidate-form").classList.remove("hidden");
        }

        function showAdminForm() {
            hideAllForms();
            document.getElementById("admin-form").classList.remove("hidden");
        }

        function hideAllForms() {
            document.getElementById("buttons").classList.add("hidden");
            document.getElementById("voter-form").classList.add("hidden");
            document.getElementById("candidate-form").classList.add("hidden");
            document.getElementById("admin-form").classList.add("hidden");
        }
    </script>
</body>
</html>
