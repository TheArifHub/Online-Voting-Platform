<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <title>Voter Home</title>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Raleway', sans-serif;
        }
        
        body {
            background: linear-gradient(45deg, #f1f7ff, #ffffff);
            min-height: 100vh;
            color: #2d3436;
        }
        
        nav {
            background: #1a237e;
            padding: 1.2rem;
            box-shadow: 0 4px 12px rgba(26, 35, 126, 0.2);
        }
        
        nav ul {
            display: flex;
            justify-content: flex-end;
            list-style: none;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        nav ul li a {
            color: white;
            text-decoration: none;
            padding: 0.8rem 1.2rem;
            margin: 0 0.5rem;
            border-radius: 6px;
            transition: all 0.3s ease;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        nav ul li a:hover {
            background: #283593;
            transform: translateY(-2px);
        }
        
        .voter-dashboard {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 2rem;
        }
        
        .voter-info {
            background: rgba(255, 255, 255, 0.95);
            padding: 3rem 2rem;
            border-radius: 20px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.1);
            text-align: center;
            position: relative;
            overflow: hidden;
            margin-bottom: 2.5rem;
        }
        
        .voter-info::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, #ff9933, #ffffff, #138808);
        }
        
        .voter-info h1 {
            font-size: 2.5rem;
            color: #1a237e;
            margin-bottom: 1rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        .candidates-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
        }
        
        .candidate-card {
            background: white;
            padding: 2.5rem;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.06);
            transition: all 0.4s ease;
            border: 1px solid rgba(26, 35, 126, 0.1);
        }
        
        .candidate-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 30px rgba(0,0,0,0.12);
        }
        
        .profile-image {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            margin: 0 auto 1.5rem;
            overflow: hidden;
            border: 3px solid #1a237e;
        }
        
        .profile-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }
        
        .candidate-card:hover .profile-image img {
            transform: scale(1.1);
        }
        
        .candidate-info h3 {
            color: #1a237e;
            font-size: 1.5rem;
            margin-bottom: 1rem;
            font-weight: 700;
        }
        
        .party-name {
            color: #3498db;
            font-weight: 600;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .vote-button {
            padding: 1rem 2.5rem;
            background: #1a237e;
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.4s ease;
            box-shadow: 0 5px 15px rgba(26, 35, 126, 0.3);
            margin-top: 1.5rem;
        }
        
        .vote-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        }
        
        @media (max-width: 768px) {
            .voter-info h1 {
                font-size: 2rem;
            }
            
            .candidate-card {
                padding: 2rem 1.5rem;
            }
        }
        </style>
        
  </head>
  <body>
    <nav>
      <ul>
        <li><a href="/voter/dashboard">Dashboard</a></li>
        <li><a href="/voter/profile">Profile</a></li>
        <li><a href="/logout">Logout</a></li>
      </ul>
    </nav>

    <div class="voter-dashboard">
      <div
        class="message"
        th:if="${session.success != null || session.error != null}"
      >
        <div
          class="success"
          th:if="${session.success != null}"
          th:text="${session.success}"
        ></div>
        <div
          class="error"
          th:if="${session.error != null}"
          th:text="${session.error}"
        ></div>
        <th:block th:text="${@messageRemover.remove()}"></th:block>
      </div>

      <div class="voter-info">
        <h1>
          Welcome, <span th:text="${session.voter.fullname}">Voter</span>!
        </h1>
        <p>Your Voter ID: <span th:text="${session.voter.id}"></span></p>
      </div>

      <div class="candidates-section">
        <div class="candidate-card" th:each="candidate : ${candidates}">
          <div class="candidate-info">
            <div class="profile-image" th:if="${candidate.profilePicUrl}">
              <img
                th:src="${candidate.profilePicUrl}"
                alt="Candidate Profile"
              />
            </div>
            <h3 th:text="${candidate.fullname}">Candidate Name</h3>
            <p class="party-name" th:text="${candidate.party}">Party Name</p>
            <p class="constituency" th:text="${candidate.constituency}">
              Constituency
            </p>
            <p class="manifesto" th:text="${candidate.manifesto}">Manifesto</p>
            <form th:action="@{/voter/cast-vote}" method="post">
              <input
                type="hidden"
                name="candidateId"
                th:value="${candidate.id}"
              />
              <button type="submit" class="vote-button">Vote</button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const message = document.querySelector(".message");
        if (message) {
          setTimeout(function () {
            message.style.display = "none";
          }, 2000);
        }
      });
    </script>
  </body>
</html>
