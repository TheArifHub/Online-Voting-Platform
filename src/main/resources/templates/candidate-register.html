<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Voting System - Candidate Registration</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
        }

        nav {
            background-color: #2c3e50;
            padding: 1rem;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        nav ul {
            display: flex;
            justify-content: flex-end;
            list-style: none;
            max-width: 1200px;
            margin: 0 auto;
        }

        nav ul li a {
            color: white;
            text-decoration: none;
            padding: 0.5rem 1rem;
            margin: 0 0.5rem;
            border-radius: 4px;
            transition: background-color 0.3s;
        }

        nav ul li a:hover {
            background-color: #34495e;
        }

        .register-container {
            max-width: 600px;
            margin: 2rem auto;
            padding: 2rem;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .register-container h1 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 2rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            color: #2c3e50;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid #bdc3c7;
            border-radius: 4px;
            font-size: 1rem;
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 5px rgba(52, 152, 219, 0.3);
        }

        .submit-btn {
            background-color: #2ecc71;
            color: white;
            padding: 1rem 2rem;
            border: none;
            border-radius: 5px;
            font-size: 1.1rem;
            cursor: pointer;
            width: 100%;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>
    <nav>
        <ul>
            <li><a href="/home">Home</a></li>
            <li><a href="/about">About</a></li>
            <li><a href="#vote">Vote Now</a></li>
            <li><a href="#results">Results</a></li>
            <li><a href="/contact">Contact</a></li>
        </ul>
    </nav>

    <div class="register-container">
        <h1>Candidate Registration</h1>
        <form action="/candidate/candidate-register" method="post" th:object="${candidate}">
            <div class="form-group">
                <label for="fullname">Full Name</label>
                <input type="text" id="fullname" th:field="*{fullname}" required>
                <span th:errors="*{fullname}"></span>
            </div>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" th:field="*{email}" required>
                <span th:errors="*{email}"></span>
            </div>
            <div class="form-group">
                <label for="party">Political Party</label>
                <select id="party" name="party" th:field="*{party}" required>
                    <option value="" disabled selected>Select a Party</option>
                    <option value="Future Progress Party">Future Progress Party</option>
                    <option value="People's Unity Party">People's Unity Party</option>
                    <option value="Green Alliance">Green Alliance</option>
                    <option value="National Reform Party">National Reform Party</option>
                </select>
                <span th:errors="*{party}"></span>
            </div>
            
            <div class="form-group">
                <label for="constituency">Constituency</label>
                <select id="constituency" name="constituency" th:field="*{constituency}" required>
                    <option value="" disabled selected>Select a Constituency</option>
                    <option value="Greenfield">Greenfield</option>
                    <option value="Riverside">Riverside</option>
                    <option value="Sunnyvale">Sunnyvale</option>
                    <option value="Hilltop">Hilltop</option>
                    <option value="Lakeside">Lakeside</option>
                </select>
                <span th:errors="*{constituency}"></span>
            </div>
            
            <div class="form-group">
                <label for="manifesto">Manifesto</label>
                <input type="text" id="manifesto" th:field="*{manifesto}" required>
                <span th:errors="*{manifesto}"></span>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" th:field="*{password}" required>
                <span th:errors="*{password}"></span>
            </div>
            <div class="form-group">
                <label for="confirm-password">Confirm Password</label>
                <input type="password" id="confirm-password" th:field="*{confirmPassword}" required>
                <span th:errors="*{confirmPassword}"></span>
            </div>
            <button type="submit" class="submit-btn">Register as Candidate</button>
        </form>
    </div>
</body>
</html>
