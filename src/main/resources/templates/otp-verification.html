<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OTP Verification</title>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
	* {
		margin: 0;
		padding: 0;
		box-sizing: border-box;
		font-family: 'Raleway', sans-serif;
	}
	
	body {
		background: linear-gradient(45deg, #f1f7ff, #ffffff);
		min-height: 100vh;
		display: flex;
		justify-content: center;
		align-items: center;
		color: #2d3436;
	}
	
	.otp-container {
		background: rgba(255, 255, 255, 0.95);
		padding: 3rem 2rem;
		border-radius: 20px;
		box-shadow: 0 15px 30px rgba(0,0,0,0.1);
		width: 450px;
		text-align: center;
		position: relative;
		overflow: hidden;
	}
	
	.otp-container::before {
		content: '';
		position: absolute;
		top: 0;
		left: 0;
		right: 0;
		height: 5px;
		background: linear-gradient(90deg, #ff9933, #ffffff, #138808);
	}
	
	.otp-container h2 {
		font-size: 2.5rem;
		color: #1a237e;
		margin-bottom: 1.5rem;
		font-weight: 800;
		text-transform: uppercase;
		letter-spacing: 2px;
	}
	
	.timer {
		font-size: 1.3rem;
		color: #e74c3c;
		margin-bottom: 2rem;
		font-weight: 600;
		letter-spacing: 1px;
	}
	
	.otp-input {
		width: 100%;
		padding: 1.2rem;
		border: 2px solid rgba(26, 35, 126, 0.1);
		border-radius: 50px;
		font-size: 1.2rem;
		text-align: center;
		transition: all 0.3s ease;
		margin-bottom: 1.5rem;
		letter-spacing: 4px;
	}
	
	.otp-input:focus {
		outline: none;
		border-color: #1a237e;
		box-shadow: 0 0 10px rgba(26, 35, 126, 0.1);
	}
	
	.verify-btn {
		width: 100%;
		padding: 1.2rem;
		background: #1a237e;
		color: white;
		border: none;
		border-radius: 50px;
		font-size: 1.1rem;
		font-weight: 600;
		text-transform: uppercase;
		letter-spacing: 1px;
		cursor: pointer;
		transition: all 0.4s ease;
		box-shadow: 0 5px 15px rgba(26, 35, 126, 0.3);
	}
	
	.verify-btn:hover:not(:disabled) {
		transform: translateY(-3px);
		box-shadow: 0 8px 25px rgba(0,0,0,0.2);
	}
	
	.verify-btn:disabled {
		background: #bdc3c7;
		cursor: not-allowed;
	}
	
	.resend-link {
		display: inline-block;
		margin-top: 1.5rem;
		color: #1a237e;
		text-decoration: none;
		font-weight: 600;
		font-size: 1.1rem;
		transition: all 0.3s ease;
	}
	
	.resend-link:hover {
		color: #3498db;
		transform: translateY(-2px);
	}
	
	@media (max-width: 768px) {
		.otp-container {
			width: 90%;
			margin: 0 1rem;
		}
	}
	</style>
	
</head>
<body>
	<div class="otp-container">
		<h2>OTP Verification</h2>
		<p class="timer" id="timer">Time remaining: 60 seconds</p>

		<div class="message"
			th:if="${session.success != null || session.error != null}">
			<h3 style="color: green;" th:text="${session.success}"></h3>
			<h3 style="color: red" th:text="${session.error}"></h3>
			<th:block th:text="${@messageRemover.remove()}"></th:block>
		</div>

		<form action="/voter/otp" method="post">
			<input type="hidden" name="id" th:value="${id}" /> <label for="otp">Enter
				OTP:</label> <input type="text" id="otp" name="otp"
				placeholder="Enter your OTP" />
			<button type="submit" id="submit-btn">Verify OTP</button>
			<a th:href="'/voter/resend-otp/'+${id}" id="resend-btn"
				style="display: none;">Resend OTP</a>
		</form>
	</div>

	<script>
        let timeLeft = 60;
        const timerElement = document.getElementById('timer');
        const submitButton = document.getElementById('submit-btn');
        const resendLink = document.getElementById('resend-btn');

        const timer = setInterval(() => {
            if (timeLeft <= 0) {
                clearInterval(timer);
                timerElement.textContent = 'Time expired!';
                submitButton.disabled = true;
                resendLink.style.display = 'block';
            } else {
                timerElement.textContent = `Time remaining: ${timeLeft} seconds`;
                timeLeft -= 1;
            }
        }, 1000);
        
        document.addEventListener('DOMContentLoaded', function() {
			const message = document.querySelector('.message');
			if (message) {
				setTimeout(function() {
					message.style.display = 'none';
				}, 2000);
			}
		});
    </script>
</body>
</html>
