<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voter Profile - Online Voting System</title>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Raleway', sans-serif;
        }
        
        body {
            background: linear-gradient(45deg, #f1f7ff, #ffffff);
            min-height: 100vh;
            color: #2d3436;
        }
        
        nav {
            background: #1a237e;
            padding: 1.2rem;
            box-shadow: 0 4px 12px rgba(26, 35, 126, 0.2);
        }
        
        nav ul {
            display: flex;
            justify-content: flex-end;
            list-style: none;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        nav ul li a {
            color: white;
            text-decoration: none;
            padding: 0.8rem 1.2rem;
            margin: 0 0.5rem;
            border-radius: 6px;
            transition: all 0.3s ease;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        nav ul li a:hover {
            background: #283593;
            transform: translateY(-2px);
        }
        
        .profile-container {
            max-width: 900px;
            margin: 3rem auto;
            padding: 3rem 2rem;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.1);
            position: relative;
            overflow: hidden;
        }
        
        .profile-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, #ff9933, #ffffff, #138808);
        }
        
        .profile-header {
            text-align: center;
            margin-bottom: 3rem;
            padding-bottom: 2rem;
            border-bottom: 2px solid rgba(26, 35, 126, 0.1);
        }
        
        .profile-header h1 {
            font-size: 2.5rem;
            color: #1a237e;
            margin-bottom: 1rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        .profile-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 2rem;
        }
        
        .detail-group {
            background: #f8f9fa;
            padding: 2rem;
            border-radius: 15px;
            transition: all 0.4s ease;
        }
        
        .detail-group:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.06);
        }
        
        .detail-group h3 {
            color: #1a237e;
            font-size: 1.3rem;
            margin-bottom: 1rem;
            font-weight: 700;
            text-transform: uppercase;
        }
        
        .detail-group p {
            color: #455a64;
            font-size: 1.1rem;
            line-height: 1.6;
        }
        
        .voting-status {
            margin-top: 3rem;
            text-align: center;
            padding: 2rem;
            background: #f8f9fa;
            border-radius: 15px;
        }
        
        .status-badge {
            display: inline-block;
            padding: 1rem 2.5rem;
            border-radius: 50px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 1rem;
        }
        
        .voted {
            background: #d4edda;
            color: #155724;
        }
        
        .not-voted {
            background: #f8d7da;
            color: #721c24;
        }
        
        @media (max-width: 768px) {
            .profile-container {
                margin: 2rem;
            }
            
            .profile-header h1 {
                font-size: 2rem;
            }
        }
        </style>
        
</head>
<body>
    <nav>
        <ul>
            <li><a href="/voter/dashboard">Dashboard</a></li>
            <li><a href="/voter/profile">Profile</a></li>
            <li><a href="/logout">Logout</a></li>
        </ul>
    </nav>

    <div class="profile-container">
        <div class="profile-header">
            <h1>Voter Profile</h1>
            <p>Your voting information and details</p>
        </div>

        <div class="profile-details">
            <div class="detail-group">
                <h3>Full Name</h3>
                <p th:text="${session.voter.fullname}">Voter Name</p>
            </div>

            <div class="detail-group">
                <h3>Email Address</h3>
                <p th:text="${session.voter.email}">voter@email.com</p>
            </div>

            <div class="detail-group">
                <h3>Voter ID</h3>
                <p th:text="${session.voter.voterid}">VOTER123</p>
            </div>

            <div class="voting-status">
                <h3>Voting Status</h3>
                <div th:if="${session.voter.hasVoted}" class="status-badge voted">
                    Voted
                </div>
                <div th:unless="${session.voter.hasVoted}" class="status-badge not-voted">
                    Not Voted
                </div>
            </div>
        </div>
    </div>
</body>
</html>
